<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>술곳간</title>
<meta name="description" content="술곳간 · 집에 있는 와인과 위스키를 라벨 사진으로 정리하는 개인 술 창고 앱 · Your home wine & whisky cellar, catalogued from label photos.">
<meta name="theme-color" content="#16110E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="술곳간">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="whisky">
<header class="top gutter">
  <div class="wrap">
    <div class="titlebar">
      <div class="brand">
        <div class="lantern" aria-hidden="true"><i class="cap"></i><i class="lamp"></i><i class="cap"></i></div>
        <div>
          <h1 id="title">술곳간</h1>
          <div id="ledger" class="ledger">&nbsp;</div>
        </div>
      </div>
      <button class="iconbtn" id="setBtn" aria-label="설정"><img class="px" id="gearImg" src="icons/px/a-gear.png" alt=""></button>
    </div>
    <div class="tabs" role="group">
      <button data-f="all" aria-pressed="true">전체</button>
      <button data-f="wine" aria-pressed="false">와인</button>
      <button data-f="whisky" aria-pressed="false">위스키</button>
      <button data-f="other" aria-pressed="false">기타</button>
    </div>
    <div class="bar">
      <label class="search"><span aria-hidden="true">&gt;</span><input id="q" type="search" aria-label="search"></label>
      <select class="sort" id="sort" aria-label="sort"></select>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="wrap">
    <div class="banner" id="banner" hidden></div>
    <div id="list"></div>
    <div id="status" class="empty"><strong>…</strong></div>
  </div>
</main>

<button class="fab" id="fab" aria-label="술 등록"><img class="px" id="fabImg" src="icons/px/a-cam.png" alt=""><span class="lbl" id="fabLbl"></span></button>

<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
